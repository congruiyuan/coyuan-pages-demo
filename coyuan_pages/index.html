<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ✅ 微信分享卡片：标题/描述/缩略图（og:image 一定要用 https 绝对地址） -->
<title>coyuan pages</title>
<meta name="description" content="archive idea" />

<meta property="og:type" content="website" />
<meta property="og:title" content="coyuan pages" />
<meta property="og:description" content="archive idea" />

<!-- ⚠️ 必填：把下面两行改成你真实的线上地址 -->
<meta property="og:url" content="https://congruiyuan.com/" />
<meta property="og:image" content="https://congruiyuan.com/assets/share-cover.png" />

<!-- 可选：兼容一些抓取习惯 -->
<meta itemprop="name" content="coyuan pages" />
<meta itemprop="description" content="archive idea" />
<meta itemprop="image" content="https://congruiyuan.com/assets/share-cover.png" />

<!-- 更稳的字体加载（减少闪烁/替换感） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">

<style>
:root{
  --icon-size: clamp(22px, 4vw, 48px);
  --walking-scale: 0.7;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  width:100vw;
  background-image:url("./主域名界面/噪点蓝色背景.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
}

button,a,img,div,span{
  -webkit-tap-highlight-color:transparent;
}

.center-stack{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

.gif-stack{
  position:relative;
  width:80vw;
  max-width:900px;
}

.gif-1{
  width:100%;
  height:auto;
  display:block;
}

.gif-2{
  position:absolute;
  top:50%;
  left:50%;
  width:100%;
  height:auto;
  transform:translate(-50%,-50%) scale(var(--walking-scale));
  transform-origin:center center;
  display:block;
}

/* 尽量禁止保存/拖拽（无法100%防截图/抓包，但能阻止常见手段） */
img{
  -webkit-user-drag:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  pointer-events:none;
}

/* 第一页按钮 */
.entrance{
  position:absolute;
  background:none;
  border:none;
  padding:0;
  margin:0;

  display:inline-flex;
  align-items:center;
  gap:8px;

  color:#fff;
  font-size:clamp(22px,4vw,48px);
  font-family:'Swanky and Moo Moo', cursive;

  cursor:pointer;
  white-space:nowrap;

  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -ms-user-select:none;

  transition:opacity 120ms ease;
}
.entrance:active{opacity:0.4;}

.entrance img{
  width:var(--icon-size);
  height:auto;
  display:block;
}

/* 第二页 */
.page-2{
  position:fixed;
  inset:0;
  background:#32567D;
  opacity:0;
  pointer-events:none;
  transition:opacity 320ms ease;
  z-index:999;
}
.page-2.show{
  opacity:1;
  pointer-events:auto;
}

.page-2 .content{
  height:100%;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.page-2 .text-block{
  text-align:left;
  color:#fff;
  font-size:clamp(22px,4vw,44px);
  line-height:1.15;
  font-family:'Swanky and Moo Moo', cursive;
}

.page-2 .line-2{
  margin-top:14px;
  animation:softPulse 2.6s ease-in-out infinite;
}

@keyframes softPulse{
  0%{opacity:1;}
  50%{opacity:0.7;}
  100%{opacity:1;}
}

.back-row{
  margin-top:16px;
  display:flex;
  justify-content:flex-end;
}

.back-btn{
  background:none;
  border:none;
  padding:0;
  margin:0;
  cursor:pointer;
  transition:opacity 120ms ease;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.back-btn:active{opacity:0.4;}

.back-btn img{
  width:var(--icon-size);
  height:auto;
  display:block;
}
</style>
</head>

<body>

<!-- 第一页 -->
<div class="center-stack">
  <div class="gif-stack" id="gifStack">
    <img class="gif-1" src="./主域名界面/bg_folder.gif" alt="">
    <img class="gif-2" id="walking" src="./主域名界面/walking_man.gif" alt="">

    <button class="entrance" id="entranceBtn" type="button" aria-label="Entrance">
      <span>Entrance</span>
      <img src="./主域名界面/entrance_icon.png" alt="">
    </button>
  </div>
</div>

<!-- 第二页 -->
<div class="page-2" id="page2" aria-hidden="true">
  <div class="content">
    <div class="text-block">
      <div class="line-1">Designing rhythm in digital space</div>
      <div class="line-2">Something amazing is coming...</div>

      <div class="back-row">
        <button class="back-btn" id="backBtn" type="button" aria-label="Back">
          <img src="./主域名界面/entrance_icon.png" alt="">
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const gap = 10;
const btnRatio = 2/5;

function positionEntrance(){
  const walking = document.getElementById('walking');
  const btn = document.getElementById('entranceBtn');
  const stack = document.getElementById('gifStack');

  if(!walking.complete || !walking.naturalWidth) return;

  const sRect = stack.getBoundingClientRect();
  const stackWidth = sRect.width;
  const stackHeight = sRect.height;

  const scale = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--walking-scale')
  ) || 0.7;

  const walkingWidth = stackWidth * scale;
  const walkingHeight = walkingWidth * (walking.naturalHeight / walking.naturalWidth);

  const btnWidth = walkingWidth * btnRatio;
  btn.style.width = btnWidth + "px";
  btn.style.justifyContent = "center";

  const walkingRight = (stackWidth/2) + (walkingWidth/2);
  const walkingBottom = (stackHeight/2) + (walkingHeight/2);

  btn.style.left = (walkingRight - btnWidth) + "px";
  btn.style.top = (walkingBottom + gap) + "px";
}

function rerun(){
  positionEntrance();
  requestAnimationFrame(positionEntrance);
  setTimeout(positionEntrance,100);
}

window.addEventListener('load',()=>{
  rerun();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(rerun);
  }
});
window.addEventListener('resize',rerun);

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());

const entranceBtn=document.getElementById('entranceBtn');
const backBtn=document.getElementById('backBtn');
const page2=document.getElementById('page2');

entranceBtn.addEventListener('click',()=>{
  page2.classList.add('show');
  page2.setAttribute('aria-hidden','false');
});

backBtn.addEventListener('click',()=>{
  page2.classList.remove('show');
  page2.setAttribute('aria-hidden','true');
});
</script>

</body>
</html>
