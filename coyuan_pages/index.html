<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>coyuan_pages</title>

<link href="https://fonts.googleapis.com/css2?family=Swanky+and+Moo+Moo&display=swap" rel="stylesheet">

<style>
  :root{
    --icon-size: clamp(22px, 4vw, 48px);
    --walking-scale: 0.7; /* ✅ 只改这里就能控制 walking 大小 */
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body{
    height:100vh; width:100vw;
    background-image:url("./主域名界面/噪点蓝色背景.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
    overflow:hidden;
    font-family:'Swanky and Moo Moo', cursive;
  }

  button, a, img, div, span { -webkit-tap-highlight-color: transparent; }

  .center-stack{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
  }

  .gif-stack{
    position:relative;
    width:80vw;
    max-width:900px;
  }

  .gif-1{ width:100%; height:auto; display:block; }

  .gif-2{
    position:absolute;
    top:50%; left:50%;
    width:100%;
    height:auto;
    transform:translate(-50%, -50%) scale(var(--walking-scale));
    transform-origin:center center;
    display:block;
  }

  img{
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }

  .entrance{
    position:absolute;
    background:none;
    border:none;
    padding:0;
    margin:0;

    display:inline-flex;
    align-items:center;
    gap:8px;

    color:#fff;
    font-size:clamp(22px, 4vw, 48px);
    font-family:'Swanky and Moo Moo', cursive;

    cursor:pointer;
    white-space:nowrap;

    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;

    transition: opacity 120ms ease;
  }
  .entrance:active{ opacity:0.4; }

  .entrance img{
    width: var(--icon-size);
    height:auto;
    display:block;
    pointer-events:none;
  }

  .page-2{
    position:fixed;
    inset:0;
    background:#32567D;
    opacity:0;
    pointer-events:none;
    transition: opacity 320ms ease;
    z-index:999;
  }
  .page-2.show{ opacity:1; pointer-events:auto; }

  .page-2 .content{
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .page-2 .text-block{
    text-align:left;
    color:#fff;
    font-size: clamp(22px, 4vw, 44px);
    line-height: 1.15;
  }

  .page-2 .line-2{
    margin-top: 14px;
    animation: softPulse 2.6s ease-in-out infinite;
  }

  @keyframes softPulse{
    0%   { opacity: 1; }
    50%  { opacity: 0.7; }
    100% { opacity: 1; }
  }

  .back-row{
    margin-top: 16px;
    display:flex;
    justify-content:flex-end;
  }

  .back-btn{
    background:none;
    border:none;
    padding:0;
    margin:0;
    cursor:pointer;
    transition: opacity 120ms ease;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    -webkit-user-select:none;
  }
  .back-btn:active{ opacity:0.4; }

  .back-btn img{
    width: var(--icon-size);
    height:auto;
    display:block;
    pointer-events:none;
  }
</style>
</head>

<body>

  <div class="center-stack" id="page1">
    <div class="gif-stack" id="gifStack">
      <img class="gif-1" src="./主域名界面/bg_folder.gif" alt="">
      <img class="gif-2" id="walking" src="./主域名界面/walking_man.gif" alt="">

      <button class="entrance" id="entranceBtn" type="button" aria-label="Entrance">
        <span>Entrance</span>
        <img src="./主域名界面/entrance_icon.png" alt="">
      </button>
    </div>
  </div>

  <div class="page-2" id="page2" aria-hidden="true">
    <div class="content">
      <div class="text-block">
        <div class="line-1">Designing rhythm in digital space</div>
        <div class="line-2">Something amazing is coming...</div>

        <div class="back-row">
          <button class="back-btn" id="backBtn" type="button" aria-label="Back">
            <img src="./主域名界面/entrance_icon.png" alt="">
          </button>
        </div>
      </div>
    </div>
  </div>

<script>
  const gap = 10;
  const btnRatio = 2 / 5;

  function getWalkingScale(){
    const v = getComputedStyle(document.documentElement).getPropertyValue('--walking-scale').trim();
    const n = parseFloat(v);
    return Number.isFinite(n) ? n : 0.7;
  }

  function positionEntrance() {
    const walking = document.getElementById('walking');
    const btn = document.getElementById('entranceBtn');
    const stack = document.getElementById('gifStack');
    if (!walking.complete || !walking.naturalWidth) return;

    const walkingScale = getWalkingScale();
    const stackWidth = stack.clientWidth;

    const walkingWidth = stackWidth * walkingScale;
    const walkingHeight = walkingWidth * (walking.naturalHeight / walking.naturalWidth);

    const btnWidth = Math.max(walkingWidth * btnRatio, 160);
    btn.style.width = btnWidth + "px";
    btn.style.justifyContent = "center";

    const stackHeight = stack.clientHeight;
    const walkingRight = (stackWidth / 2) + (walkingWidth / 2);
    const walkingBottom = (stackHeight / 2) + (walkingHeight / 2);

    btn.style.left = (walkingRight - btnWidth) + "px";
    btn.style.top = (walkingBottom + gap) + "px";
  }

  function rerunPositioning() {
    positionEntrance();
    requestAnimationFrame(positionEntrance);
    setTimeout(positionEntrance, 100);
  }

  window.addEventListener('load', () => {
    rerunPositioning();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(rerunPositioning);
    }
  });

  window.addEventListener('resize', rerunPositioning);

  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dragstart', (e) => e.preventDefault());

  const entranceBtn = document.getElementById('entranceBtn');
  const backBtn = document.getElementById('backBtn');
  const page2 = document.getElementById('page2');

  entranceBtn.addEventListener('click', () => {
    page2.classList.add('show');
    page2.setAttribute('aria-hidden', 'false');
  });

  backBtn.addEventListener('click', () => {
    page2.classList.remove('show');
    page2.setAttribute('aria-hidden', 'true');
  });
</script>

</body>
</html>
