<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coyuan Pages — 2页Demo</title>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #f3f3f3;
      --muted: rgba(243,243,243,.65);
      --line: rgba(243,243,243,.12);
      --card: rgba(255,255,255,.03);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; } /* 让锚点滚动更顺 */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial;
    }

    /* 两页：每页占满一屏 */
    .page {
      min-height: 100vh;
      padding: 40px 20px;
      display: grid;
      place-items: center;
    }

    .card {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 18px;
      padding: 28px 22px;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: .4px;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 1.1s ease forwards;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 1.3s ease forwards;
      animation-delay: .15s;
    }

    .btn-row {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      color: var(--fg);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:hover { background: rgba(255,255,255,.10); }
    button:active { transform: scale(.98); }

    .hint {
      font-size: 12px;
      color: rgba(243,243,243,.45);
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 1.4s ease forwards;
      animation-delay: .35s;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* 第二页内容排版 */
    .content h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: .2px;
    }
    .content .block {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
    }
    .content .block p {
      opacity: 1;              /* 第二页不要重复用 fadeUp */
      transform: none;
      animation: none;
      color: var(--muted);
      margin: 0;
    }

    /* 让第二页更“有空间感” */
    .spacer { height: 18vh; }
  </style>
</head>

<body>
  <!-- 第1页 -->
  <section class="page" id="page1" aria-label="Page 1">
    <div class="card">
      <h1>Coyuan Pages</h1>
      <p>两页小体验：点击按钮进入第二页，然后继续上下滚动。</p>

      <div class="btn-row">
        <button id="toPage2" type="button">Enter</button>
        <span class="hint">Tip: 这就是“节奏”的第一拍。</span>
      </div>
    </div>
  </section>

  <!-- 第2页 -->
  <section class="page" id="page2" aria-label="Page 2">
    <div class="card content">
      <h2>Page 2 — Scroll</h2>
      <p style="margin:0;color:rgba(243,243,243,.55);line-height:1.7;">
        这里开始是叙事区。你可以把它当成 4–6 个 section 的雏形。
      </p>

      <div class="spacer"></div>

      <div class="block">
        <p>Block 01：一段很短的文字，留白让它更有重量。</p>
      </div>

      <div class="block">
        <p>Block 02：下一段继续出现，节奏慢一点。</p>
      </div>

      <div class="block">
        <p>Block 03：这里可以放一张图、一个句子、或一个小互动。</p>
      </div>

      <div class="spacer"></div>

      <div class="btn-row">
        <button id="backToTop" type="button">Back to top</button>
        <span class="hint" style="opacity:1;transform:none;animation:none;">可以继续加长内容来测试滚动。</span>
      </div>
    </div>
  </section>

  <script>
    // 点击按钮滚到第二页
    document.getElementById('toPage2').addEventListener('click', () => {
      document.getElementById('page2').scrollIntoView({ behavior: 'smooth' });
    });

    // 返回顶部
    document.getElementById('backToTop').addEventListener('click', () => {
      document.getElementById('page1').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
