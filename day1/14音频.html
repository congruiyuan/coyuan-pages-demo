<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 音频 -->
    <!-- 在HTML5里面，如果属性名和属性值完全一样，可以简写为一个单词 -->
    <audio src="./14-音频、视频/网易云.mp3" controls loop autoplay></audio>
    <!-- 视频 -->
    <!-- 在浏览器中，想要自动播放，必须要有muted属性 -->
    <video src="./14-音频、视频/视频.mp4" controls loop autoplay muted></video>
</body>
</html>
