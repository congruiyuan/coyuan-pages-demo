    <h1>Vue.js</h1>
    <p>Vue3 是一套渐进式 JavaScript 框架（渐进式 = 可以按需使用，不用一次性学完所有功能），专门用来开发前端页面（尤其是单页面应用 SPA）</p>
    <p>作者是<a href="./综合案例1.html" target="_blank"><ins>youyuxi艺术家 </ins></a> </p>
    <h2>主要功能</h2>
    <p><strong>组件化开发：</strong> 把页面拆成一个个可复用的 “积木”（比如按钮、导航栏、卡片），降低开发复杂度；</p>
    <p><strong>轻量且易用：</strong> 核心体积小（打包后～10KB），上手门槛比 React 低，适合新手</p>
