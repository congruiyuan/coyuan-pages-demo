<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 特点：输入什么就显示什么 -->
    文本框：<input type="text" placeholder="请输入名字"><br>
    <!-- 特点：输入什么都是以‘·’的形式 -->
    密码框：<input type="password" placeholder="请输入密码"><br>
    性别：
    <input type="radio" name="gender" > 男
    <input type="radio" name="gender" checked> 女
    <br>
    兴趣爱好：
    <input type="checkbox" checked> 吃饭
    <input type="checkbox"> 睡觉
    <input type="checkbox" checked> 打豆豆
    <br>
    上传文件：<input type="file" multiple> <br>
    城市：
    <select>
        <option value="beijing" >北京</option>
        <option value="shanghai" selected>上海</option>
        <option value="guangzhou">广州</option>
    </select>
    <!-- 可以输入多行文本 且输入框大小可以拖拽，未来需要禁用，未来用css设置尺寸-->
    <textarea>请输入评论</textarea>
    性别：
    <!-- 写法一 -->
    <input type="radio" name="gender2" id="man"> <label for="man">男</label> 
    <!-- 写法二 -->
     <label><input type="radio" name="gender2">女</label>
    <br>
    <!-- form 表单区域标签 -->
    <!-- action 未来发送数据的地址 -->
     <form action="">
     用户名：
    <input type="text" placeholder="请输入用户名"><br>
    密码：
    <input type="password" placeholder="请输入密码"><br>
    <!-- 按钮 -->
     <!-- 如果省略type属性，功能是 提交 -->
     <button type="submit">提交</button>
     <button type="reset">重置</button>
     <button type="button">普通按钮</button>
     </form>

     <!-- div：大盒子 -->
    <div>这是div标签</div>
    <div>这是div标签</div>
    <!-- span：小盒子 -->
    <span>这是span标签</span>
    <span>这是span标签</span>
    <br>

    <!-- 在代码中敲键盘的空格，网页只识别一个 -->
    易烊千&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;玺
    &lt;p&gt;
</body>
</html>
