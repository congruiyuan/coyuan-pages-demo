<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ul>
    <ol>
        <li>有序列表项1</li>
        <li>有序列表项2</li>
        <li>有序列表项3</li>
    </ol>
    <dl>
        <dt>运动</dt>
        <dd>羽毛球</dd>
        <dd>排球</dd>
        <dt>美食</dt>
        <dd>炸鸡</dd>
        <dd>火锅</dd>

        <thead>
            <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>性别</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td rowspan="2"> 20</td>
                <td>男</td>
            </tr>
            <tr>
                <td>李四</td>
                <!-- <td>20</td> -->
                <td>女</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>总结</td>
                <td colspan="2">第一名</td>
                <!-- <td>第一名</td> -->
            </tr>
        </tfoot>
    </table>

</html>
